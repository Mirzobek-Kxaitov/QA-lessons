name: Daily QA delivery audit
on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh QA market', 'Refresh Telegram QA posts']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: qa-delivery-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore current source snapshots
        run: python scripts/qa-market/snapshot_store.py
      - run: pip install -r scripts/qa-market/requirements.txt
      - run: python -m unittest discover -s scripts/qa-market -v
      - name: Compare source inventory with the deployed site
        run: python scripts/qa-market/daily_audit.py
      - name: Save daily audit
        run: python scripts/qa-market/publish_snapshot.py qa-bozor/audit-data.json
