name: Daily QA delivery audit
on:
  schedule:
    - cron: '40 2 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ['Refresh QA market', 'Refresh Telegram QA posts']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: qa-delivery-audit
  cancel-in-progress: false
jobs:
  audit:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/qa-market/requirements.txt
      - run: python -m unittest discover -s scripts/qa-market -v
      - name: Compare source inventory with the deployed site
        run: python scripts/qa-market/daily_audit.py
      - name: Save daily audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-bozor/audit-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'audit: reconcile daily QA source deliveries'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
