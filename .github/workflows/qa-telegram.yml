name: Refresh Telegram QA posts
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-telegram-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/qa-market/requirements.txt
      - run: python -m unittest discover -s scripts/qa-market -v
      - run: node --test tests/*.test.mjs
      - name: Collect public QA posts
        id: refresh
        run: python scripts/qa-market/telegram_collect.py
      - name: Publish snapshot and attempt status
        if: always() && (steps.refresh.outcome == 'success' || steps.refresh.outcome == 'failure')
        run: python scripts/qa-market/publish_snapshot.py qa-bozor/telegram-data.json qa-bozor/telegram-health.json
      - name: Retain failed Telegram responses
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-diagnostics
          path: scripts/qa-market/data/telegram-diagnostics/
          retention-days: 7
          if-no-files-found: ignore
