name: Refresh Telegram QA posts
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: qa-telegram-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/qa-market/requirements.txt
      - run: python -m unittest discover -s scripts/qa-market -v
      - run: node --test tests/*.test.mjs
      - name: Collect public QA posts
        run: python scripts/qa-market/telegram_collect.py
      - name: Publish Telegram snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add qa-bozor/telegram-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh Telegram QA posts'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
